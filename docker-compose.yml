services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: powradar
      POSTGRES_USER: powradar
      POSTGRES_PASSWORD: powradar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ******db:5432/powradar
    depends_on:
      - db
    command: ["pow-radar", "run-all"]

volumes:
  pgdata:
